buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

apply plugin: 'com.android.library'

dependencies {
    implementation project(':HTMLCleaner')
    implementation 'commons-lang:commons-lang:2.6'
    implementation project(':osbcp-css-parser')
    androidTestImplementation 'org.testng:testng:6.11'
}

android {
    compileSdkVersion 26

    namespace "net.nightwhistler.htmlspanner"

    defaultConfig {
        minSdkVersion 14
        targetSdkVersion 21
    }
}

android {
    lintOptions {
         abortOnError false
    }
}

